# Default site of the W.R.A.P. 3 CMS (wrap3-cms-apache package), enabled on
# install: set the real domain in ServerName (wrap3.localhost only answers on
# the server itself). The content goes in /var/lib/wrap3/www.
# The CMS itself is served at /wrap/ by the wrap3-cms conf, enabled on install.
<VirtualHost *:80>
    ServerName wrap3.localhost
    DocumentRoot /var/lib/wrap3/www
    DirectoryIndex index.html index.php /wrap/wrap.php

    <Directory /var/lib/wrap3/www>
        Require all granted
        AllowOverride All
    </Directory>
</VirtualHost>
