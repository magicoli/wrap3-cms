# Example site serving the W.R.A.P. 3 CMS (wrap3-cms-apache package): set the
# real domain and document root, then enable it with: a2ensite wrap3-cms
# The CMS itself is served at /wrap/ by the wrap3-cms conf, enabled on install.
<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /var/www/example.com
    DirectoryIndex index.html index.php /wrap/wrap.php

    <Directory /var/www/example.com>
        Require all granted
        AllowOverride All
    </Directory>
</VirtualHost>
