# W.R.A.P. 3 CMS, built by apt-package (apt-repo) from build/wrap3-cms,
# prepared by packaging/build. ${VERSION} comes from the git tag.
name: wrap3-cms
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: web
priority: optional
maintainer: Magiiic <bagagiste@magiiic.com>
description: W.R.A.P. 3 CMS, media galleries published from folders (transitional)
homepage: https://github.com/magicoli/wrap3-cms
license: AGPL-3.0-or-later

depends:
  # The locked dependencies need PHP 8.2+
  - php (>= 2:8.2)
# Known issue: legacy/inc/functions.php runs /usr/local/bin/AtomicParsley and
# /usr/local/bin/mp4info, not provided here (Debian installs AtomicParsley in
# /usr/bin): the features using them fail where they are missing.

contents:
  - src: build/wrap3-cms
    dst: /usr/share/wrap3-cms
    type: tree
  # Apache: a2enconf wrap3-cms, then DirectoryIndex ... /wrap/wrap.php in sites
  # Caddy: import in a site block with the site root, see the file
  - src: packaging/wrap3-cms.caddyfile
    dst: /etc/caddy/wrap3-cms.caddyfile
    type: config
    file_info:
      mode: 0644
  - src: packaging/wrap3-cms.apache.conf
    dst: /etc/apache2/conf-available/wrap3-cms.conf
    type: config
    file_info:
      mode: 0644
