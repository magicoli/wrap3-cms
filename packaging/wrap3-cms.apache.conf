# W.R.A.P. 3 CMS (wrap3-cms package), served at /wrap/.
# Enable with: a2enconf wrap3-cms
# Then, in each site using it:
#   DirectoryIndex index.html index.php /wrap/wrap.php
Alias /wrap/ /usr/share/wrap3-cms/

<Directory /usr/share/wrap3-cms/>
    Require all granted
    AllowOverride All
</Directory>
