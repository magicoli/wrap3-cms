# W.R.A.P. 3 CMS (wrap3-cms-apache package), served at /wrap/. Enabled on
# install (a2enconf wrap3-cms). Sites using it add
#   DirectoryIndex index.html index.php /wrap/wrap.php
# see the default site, /etc/apache2/sites-available/wrap3-cms.conf.
Alias /wrap/ /usr/share/wrap3-cms/

<Directory /usr/share/wrap3-cms/>
    Require all granted
    AllowOverride All
</Directory>
