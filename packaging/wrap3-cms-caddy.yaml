# Caddy setup of the W.R.A.P. 3 CMS, built by apt-package (apt-repo): a
# snippet, imported by a site block with the site root, and an example site.
name: wrap3-cms-caddy
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: web
priority: optional
maintainer: Magiiic <bagagiste@magiiic.com>
description: W.R.A.P. 3 CMS served by Caddy with PHP-FPM (transitional)
homepage: https://github.com/magicoli/wrap3-cms
license: AGPL-3.0-or-later

depends:
  - wrap3-cms (= ${DEB_VERSION})
  - caddy
  # The locked dependencies of the CMS need PHP 8.2+
  - php-fpm (>= 2:8.2)
# The config was part of wrap3-cms up to 3.5.1
replaces:
  - wrap3-cms (<< 3.5.2)
deb:
  breaks:
    - wrap3-cms (<< 3.5.2)

contents:
  - src: packaging/wrap3-cms.snippet.caddyfile
    dst: /etc/caddy/snippets/wrap3-cms.caddyfile
    type: config
    file_info:
      mode: 0644
  # Not loaded as is (.example): copy it to a .caddyfile of the site
  - src: packaging/wrap3-cms.site.caddyfile
    dst: /etc/caddy/sites/wrap3-cms.caddyfile.example
    type: config
    file_info:
      mode: 0644

# Removes the former /etc/caddy/wrap3-cms.caddyfile (up to 3.5.3)
scripts:
  preinstall: packaging/wrap3-cms-caddy.maintscript
  postinstall: packaging/wrap3-cms-caddy.maintscript
  postremove: packaging/wrap3-cms-caddy.maintscript
